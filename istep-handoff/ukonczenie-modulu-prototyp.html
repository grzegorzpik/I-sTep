<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szlak — Moduł ukończony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1622; --ink-panel:#241D2C; --paper:#F3E9D6; --paper-dim:#9C90A6;
    --outline:#0C0910; --module-accent:#4E8FC4; --gold:#E3A83F; --bot-body:#6FA860;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif;
    min-height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .stage{ position:relative; max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; align-items:center; overflow:hidden; }

  /* flash */
  .flash{ position:fixed; inset:0; background:#fff; z-index:50; opacity:0; pointer-events:none; }
  .flash.go{ animation:flash .35s ease-out; }
  @keyframes flash{ 0%{opacity:.9;} 100%{opacity:0;} }

  /* confetti */
  .confetti{ position:absolute; top:-20px; z-index:1; }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(720px) rotate(340deg); opacity:.2; }
  }

  .content{ position:relative; z-index:2; width:100%; display:flex; flex-direction:column; align-items:center; padding-top:64px; }

  .eyebrow{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:var(--paper-dim);
    opacity:0; transform:translateY(8px);
  }
  .eyebrow.in{ animation:riseIn .4s ease-out forwards; }

  .headline{
    font-family:'Silkscreen',monospace; font-size:30px; text-align:center; margin:8px 0 4px;
    color:var(--paper); opacity:0; transform:scale(.5);
  }
  .headline.in{ animation:pop .5s cubic-bezier(.2,1.4,.4,1) .15s forwards; }

  .module-name{
    font-family:'Inter',sans-serif; font-weight:600; font-size:15px; color:var(--module-accent);
    margin-bottom:30px; opacity:0;
  }
  .module-name.in{ animation:riseIn .4s ease-out .4s forwards; }

  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }
  @keyframes pop{ 0%{opacity:0; transform:scale(.5);} 70%{opacity:1; transform:scale(1.08);} 100%{opacity:1; transform:scale(1);} }

  /* companion stage */
  .bot-stage{ position:relative; width:100%; height:190px; display:flex; align-items:flex-end; justify-content:center; margin-bottom:16px; }
  .bot-shadow{
    position:absolute; bottom:8px; width:90px; height:16px; background:#00000055; border-radius:50%; z-index:1;
    opacity:0;
  }
  .bot-shadow.in{ animation:shadowIn .5s ease-out .55s forwards; }
  @keyframes shadowIn{ to{ opacity:1; } }

  .bot-victory-wrap{
    width:150px; height:150px; position:relative; z-index:2;
    transform:translateY(220px);
  }
  .bot-victory-wrap.in{ animation:leap .7s cubic-bezier(.2,1.5,.35,1) .5s forwards; }
  @keyframes leap{
    0%{ transform:translateY(220px); }
    60%{ transform:translateY(-14px); }
    80%{ transform:translateY(6px); }
    100%{ transform:translateY(0); }
  }
  .bot-victory{
    width:100%; height:100%; display:block;
  }
  .bot-victory.walk{ animation:walk 1.1s steps(4) 1.25s infinite; }
  @keyframes walk{
    0%,100%{ transform:translate(0,0); }
    25%{ transform:translate(-14px,-3px); }
    50%{ transform:translate(0,0); }
    75%{ transform:translate(14px,-3px); }
  }
  .arm-l, .arm-r{ transform-box:fill-box; }
  .arm-l{ transform-origin:100% 15%; transform:rotate(-55deg); }
  .arm-r{ transform-origin:0% 15%; transform:rotate(55deg); }
  .bot-victory.walk .arm-l{ animation:armWaveL 0.55s steps(2) 1.25s infinite; }
  .bot-victory.walk .arm-r{ animation:armWaveR 0.55s steps(2) 1.4s infinite; }
  @keyframes armWaveL{
    0%,100%{ transform:rotate(-40deg); }
    50%{ transform:rotate(-78deg); }
  }
  @keyframes armWaveR{
    0%,100%{ transform:rotate(78deg); }
    50%{ transform:rotate(40deg); }
  }

  /* xp panel */
  .xp-panel{
    background:var(--ink-panel); border:3px solid var(--outline); box-shadow:5px 5px 0 var(--outline);
    padding:16px 20px; width:calc(100% - 40px); max-width:340px; text-align:center; margin-bottom:22px;
    opacity:0; transform:translateY(10px);
  }
  .xp-panel.in{ animation:riseIn .4s ease-out 1.15s forwards; }
  .xp-panel .lbl{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--paper-dim); text-transform:uppercase; margin-bottom:6px; }
  .xp-panel .val{ font-family:'Press Start 2P',monospace; font-size:22px; color:var(--gold); }

  .actions{ width:calc(100% - 40px); max-width:340px; display:flex; flex-direction:column; gap:10px; opacity:0; transform:translateY(10px); }
  .actions.in{ animation:riseIn .4s ease-out 1.35s forwards; }
  .btn-primary{
    font-family:'Silkscreen',monospace; font-weight:700; font-size:15px; padding:14px;
    background:var(--gold); border:3px solid var(--outline); box-shadow:5px 5px 0 var(--outline); color:var(--ink); cursor:pointer;
  }
  .btn-primary:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 var(--outline); }
  .btn-secondary{
    font-family:'JetBrains Mono',monospace; font-size:12px; padding:12px;
    background:transparent; border:2px solid var(--paper-dim); color:var(--paper-dim); cursor:pointer;
  }

  .replay{
    position:fixed; top:16px; right:16px; z-index:60;
    font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--paper-dim);
    background:var(--ink-panel); border:2px solid var(--outline); padding:6px 10px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="flash" id="flash"></div>
<div class="replay" id="replay">↻ ODTWÓRZ PONOWNIE</div>

<div class="stage">
  <div class="confetti-layer" id="confettiLayer"></div>

  <div class="content">
    <div class="eyebrow" id="eyebrow">MODUŁ 0 · ZAMKNIĘTY</div>
    <div class="headline" id="headline">MODUŁ UKOŃCZONY</div>
    <div class="module-name" id="modName">Jak działa internet</div>

    <div class="bot-stage">
      <div class="bot-shadow" id="botShadow"></div>
      <div class="bot-victory-wrap" id="botVictory">
      <svg class="bot-victory" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <rect x="7" y="0" width="2" height="1.1" fill="var(--bot-body)"/>
        <circle cx="8" cy="0.5" r="0.85" fill="var(--gold)"/>
        <rect x="3.2" y="1.6" width="9.6" height="6.8" fill="var(--paper)" stroke="var(--outline)" stroke-width="0.5"/>
        <rect x="4.4" y="3.2" width="7.2" height="3.6" fill="var(--ink)"/>
        <path d="M5.6,5.0 L6.2,4.4 L6.8,5.0" stroke="var(--gold)" stroke-width="0.65" fill="none" stroke-linecap="square"/>
        <path d="M9.0,5.0 L9.6,4.4 L10.2,5.0" stroke="var(--gold)" stroke-width="0.65" fill="none" stroke-linecap="square"/>
        <rect x="3" y="8.6" width="10" height="5.4" fill="var(--bot-body)" stroke="var(--outline)" stroke-width="0.5"/>
        <rect x="5.5" y="10.2" width="5" height="2.6" fill="var(--ink)"/>
        <rect x="6.1" y="10.7" width="3.8" height="0.5" fill="var(--gold)"/>
        <rect x="6.1" y="11.5" width="2.4" height="0.5" fill="var(--gold)"/>
        <!-- raised arms: victory pose -->
        <rect class="arm-l" x="0.6" y="9.4" width="2.2" height="2.2" fill="var(--paper)" stroke="var(--outline)" stroke-width="0.4"/>
        <rect class="arm-r" x="13.2" y="9.4" width="2.2" height="2.2" fill="var(--paper)" stroke="var(--outline)" stroke-width="0.4"/>
        <rect x="4" y="14" width="2.8" height="2" fill="var(--outline)"/>
        <rect x="9.2" y="14" width="2.8" height="2" fill="var(--outline)"/>
      </svg>
      </div>
    </div>

    <div class="xp-panel" id="xpPanel">
      <div class="lbl">Zdobyte doświadczenie</div>
      <div class="val" id="xpVal">+0 XP</div>
    </div>

    <div class="actions" id="actions">
      <button class="btn-primary">Zobacz dyplom</button>
      <button class="btn-secondary">Wróć do mapy</button>
    </div>
  </div>
</div>

<script>
const COLORS = ['#4E8FC4', '#E3A83F', '#F3E9D6'];

function spawnConfetti(){
  const layer = document.getElementById('confettiLayer');
  layer.innerHTML = '';
  for(let i=0; i<36; i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    const size = 5 + Math.random()*4;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = (Math.random()*100) + '%';
    el.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
    const duration = 1.6 + Math.random()*1.2;
    const delay = Math.random()*0.5;
    el.style.animation = `fall ${duration}s ease-in ${delay}s forwards`;
    layer.appendChild(el);
  }
}

function countXP(){
  const target = 50;
  const el = document.getElementById('xpVal');
  let current = 0;
  const step = () => {
    current += 3;
    if(current >= target){ el.textContent = '+' + target + ' XP'; return; }
    el.textContent = '+' + current + ' XP';
    requestAnimationFrame(step);
  };
  setTimeout(step, 1150);
}

function playSequence(){
  document.getElementById('flash').classList.remove('go');
  ['eyebrow','headline','modName','botShadow','botVictory','xpPanel','actions'].forEach(id=>{
    const el = document.getElementById(id);
    el.classList.remove('in');
    void el.offsetWidth;
  });
  document.querySelector('.bot-victory').classList.remove('walk');
  spawnConfetti();
  void document.getElementById('flash').offsetWidth;
  document.getElementById('flash').classList.add('go');

  requestAnimationFrame(()=>{
    ['eyebrow','headline','modName','botShadow','botVictory','xpPanel','actions'].forEach(id=>{
      document.getElementById(id).classList.add('in');
    });
    document.querySelector('.bot-victory').classList.add('walk');
  });
  document.getElementById('xpVal').textContent = '+0 XP';
  countXP();
}

document.getElementById('replay').addEventListener('click', playSequence);
window.addEventListener('load', playSequence);
</script>
</body>
</html>
