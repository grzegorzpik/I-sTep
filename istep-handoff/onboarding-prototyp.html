<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szlak — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1622;
    --ink-panel:#241D2C;
    --paper:#F3E9D6;
    --paper-dim:#9C90A6;
    --outline:#0C0910;
    --module-accent:#6FA860;
    --gold:#E3A83F;
    --bot-body:#6FA860;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:420px; width:100%; padding:36px 24px 40px; display:flex; flex-direction:column; align-items:center; }

  .step{
    font-family:'Press Start 2P',monospace; font-size:9px; color:var(--paper-dim);
    letter-spacing:.05em; margin-bottom:18px;
  }

  .preview-frame{
    width:180px; height:180px;
    background:var(--ink-panel);
    border:3px solid var(--outline);
    box-shadow:6px 6px 0 var(--outline);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:26px;
    position:relative;
  }
  .preview-frame::before{
    content:'';
    position:absolute; inset:8px;
    background-image:repeating-linear-gradient(0deg, #ffffff08 0 2px, transparent 2px 4px);
    pointer-events:none;
  }
  .bot{ width:120px; height:120px; animation:bob 1.8s steps(4) infinite; filter:drop-shadow(3px 3px 0 var(--outline)); }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-5px);} }
  .eyes{ transform-box:fill-box; transform-origin:50% 50%; animation:blink 4.2s infinite; }
  @keyframes blink{ 0%,90%,100%{ transform:scaleY(1); } 94%{ transform:scaleY(0.15); } }
  .arm-right{ transform-box:fill-box; transform-origin:0% 15%; }
  .arm-right.wave{ animation:wave 0.9s ease-in-out; }
  @keyframes wave{
    0%{ transform:rotate(0deg); }
    15%{ transform:rotate(-30deg); }
    32%{ transform:rotate(5deg); }
    48%{ transform:rotate(-25deg); }
    64%{ transform:rotate(5deg); }
    80%{ transform:rotate(-12deg); }
    100%{ transform:rotate(0deg); }
  }

  h1{
    font-family:'Silkscreen',monospace; font-size:20px; text-align:center;
    margin-bottom:8px; color:var(--paper);
  }
  .desc{
    font-size:13px; color:var(--paper-dim); text-align:center;
    margin-bottom:26px; line-height:1.5; max-width:300px;
  }

  label{
    align-self:flex-start;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600;
    color:var(--paper-dim); text-transform:uppercase; letter-spacing:.06em;
    margin-bottom:8px;
  }
  input[type=text]{
    width:100%;
    background:var(--ink-panel);
    border:3px solid var(--outline);
    box-shadow:4px 4px 0 var(--outline);
    color:var(--paper);
    font-family:'Inter',sans-serif; font-size:15px; font-weight:600;
    padding:12px 14px;
    margin-bottom:28px;
    outline:none;
  }
  input[type=text]::placeholder{ color:#5c5468; }
  input[type=text]:focus{ border-color:var(--module-accent); }

  .swatches{ display:flex; gap:12px; margin-bottom:32px; align-self:flex-start; }
  .swatch{
    width:38px; height:38px;
    border:3px solid var(--outline);
    cursor:pointer;
    box-shadow:3px 3px 0 var(--outline);
    transition:transform .1s;
  }
  .swatch.active{ transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--outline); }
  .swatch:active{ transform:translate(1px,1px); box-shadow:2px 2px 0 var(--outline); }

  .cta{
    width:100%;
    background:var(--gold);
    border:3px solid var(--outline);
    box-shadow:5px 5px 0 var(--outline);
    color:var(--ink);
    font-family:'Silkscreen',monospace; font-weight:700; font-size:15px;
    padding:14px; cursor:pointer;
  }
  .cta:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 var(--outline); }
</style>
</head>
<body>
<div class="app">
  <div class="step">KROK 2 / 2</div>

  <div class="preview-frame">
    <svg class="bot" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <!-- antenna -->
      <rect x="7" y="0" width="2" height="1.1" fill="var(--bot-body)"/>
      <circle cx="8" cy="0.5" r="0.85" fill="var(--gold)"/>
      <!-- head shell (larger) -->
      <rect x="3.2" y="1.6" width="9.6" height="6.8" fill="var(--paper)" stroke="var(--outline)" stroke-width="0.5"/>
      <!-- visor -->
      <rect x="4.4" y="3.2" width="7.2" height="3.6" fill="var(--ink)"/>
      <g class="eyes">
        <path d="M5.6,5.0 L6.2,4.4 L6.8,5.0" stroke="var(--module-accent)" stroke-width="0.6" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M9.0,5.0 L9.6,4.4 L10.2,5.0" stroke="var(--module-accent)" stroke-width="0.6" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
      </g>
      <!-- body shell -->
      <rect x="3" y="8.6" width="10" height="5.4" fill="var(--bot-body)" stroke="var(--outline)" stroke-width="0.5"/>
      <!-- chest screen -->
      <rect x="5.5" y="10.2" width="5" height="2.6" fill="var(--ink)"/>
      <rect x="6.1" y="10.7" width="3.8" height="0.5" fill="var(--gold)"/>
      <rect x="6.1" y="11.5" width="2.4" height="0.5" fill="var(--gold)"/>
      <!-- rivets -->
      <rect x="3.4" y="9" width="0.8" height="0.8" fill="var(--outline)" opacity=".5"/>
      <rect x="11.8" y="9" width="0.8" height="0.8" fill="var(--outline)" opacity=".5"/>
      <!-- arms -->
      <rect x="0.6" y="9.4" width="2.2" height="2.2" fill="var(--paper)" stroke="var(--outline)" stroke-width="0.4"/>
      <rect class="arm-right" x="13.2" y="9.4" width="2.2" height="2.2" fill="var(--paper)" stroke="var(--outline)" stroke-width="0.4"/>
      <!-- legs -->
      <rect x="4" y="14" width="2.8" height="2" fill="var(--outline)"/>
      <rect x="9.2" y="14" width="2.8" height="2" fill="var(--outline)"/>
    </svg>
  </div>

  <h1>Nazwij swojego kompana</h1>
  <div class="desc">Będzie Ci towarzyszył w każdym module!</div>

  <label for="botname">Imię</label>
  <input type="text" id="botname" placeholder="np. Byte">

  <label>Kolor</label>
  <div class="swatches" id="swatches">
    <div class="swatch active" style="background:#6FA860" data-color="#6FA860"></div>
    <div class="swatch" style="background:#4E8FC4" data-color="#4E8FC4"></div>
    <div class="swatch" style="background:#D4667A" data-color="#D4667A"></div>
    <div class="swatch" style="background:#E3A83F" data-color="#E3A83F"></div>
    <div class="swatch" style="background:#9C7FD4" data-color="#9C7FD4"></div>
  </div>

  <button class="cta">Zaczynamy</button>
</div>

<script>
document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    document.documentElement.style.setProperty('--bot-body', sw.dataset.color);

    const arm = document.querySelector('.arm-right');
    arm.classList.remove('wave');
    void arm.offsetWidth;
    arm.classList.add('wave');
  });
});
</script>
</body>
</html>
