<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szlak — Ćwiczenie praktyczne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1622; --ink-panel:#241D2C; --paper:#F3E9D6; --paper-dim:#9C90A6;
    --outline:#0C0910; --module-accent:#4E8FC4; --gold:#E3A83F; --path-idle:#3A3145;
    --danger:#C4544E; --success:#6FA860;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--ink); color:var(--paper); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:110px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 20px 6px; }
  .back{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--paper-dim); display:flex; align-items:center; gap:6px; }
  .back svg{ width:14px; height:14px; }

  .eyebrow{ padding:16px 20px 4px; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--module-accent); letter-spacing:.06em; }
  h1{ padding:0 20px 10px; font-family:'Silkscreen',monospace; font-size:21px; }
  .instruction{ padding:0 20px 22px; font-size:13px; color:var(--paper-dim); line-height:1.55; }

  section{ padding:0 20px; margin-bottom:18px; }
  .section-label{ font-family:'Press Start 2P',monospace; font-size:9px; color:var(--paper-dim); margin-bottom:10px; }

  /* your order (build area) */
  .order-slots{ display:flex; flex-direction:column; gap:8px; min-height:60px; margin-bottom:6px; }
  .slot{
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    background:var(--ink-panel); border:3px solid var(--path-idle); min-height:48px;
  }
  .slot.filled{ border-color:var(--module-accent); cursor:pointer; }
  .slot.checked-ok{ border-color:var(--success); background:#6FA86022; }
  .slot.checked-bad{ border-color:var(--danger); background:#C4544E22; }
  .slot-num{
    font-family:'Press Start 2P',monospace; font-size:10px; color:var(--paper-dim);
    width:20px; flex-shrink:0;
  }
  .slot.filled .slot-num{ color:var(--module-accent); }
  .slot-text{ font-size:12.5px; font-weight:500; color:var(--paper-dim); }
  .slot.filled .slot-text{ color:var(--paper); }
  .slot-placeholder{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#5c5468; }

  /* pool of unordered chips */
  .pool{ display:flex; flex-direction:column; gap:8px; }
  .chip{
    padding:12px 14px; background:var(--ink-panel); border:3px solid var(--outline);
    box-shadow:3px 3px 0 var(--outline); font-size:12.5px; font-weight:500; cursor:pointer;
  }
  .chip:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--outline); }
  .chip.used{ display:none; }

  .btn-row{ display:flex; gap:10px; }
  .btn-reset{
    flex:1; font-family:'JetBrains Mono',monospace; font-size:11.5px; padding:11px;
    background:var(--ink); border:2px solid var(--path-idle); color:var(--paper-dim); cursor:pointer;
  }

  .result-msg{
    display:none; margin-bottom:16px; padding:12px 14px; border:2px solid var(--danger);
    font-size:12.5px; color:var(--paper); line-height:1.5; font-family:'JetBrains Mono',monospace;
  }
  .result-msg.show{ display:block; }
  .result-msg .hint{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--path-idle); color:var(--gold); }
  .btn-retry{
    margin-top:12px; font-family:'JetBrains Mono',monospace; font-weight:600; font-size:12px;
    padding:9px 14px; background:var(--danger); border:2px solid var(--outline); color:var(--paper); cursor:pointer;
  }
  .btn-retry:active{ transform:translate(1px,1px); }

  .footer{
    position:fixed; bottom:0; left:0; right:0; z-index:5; background:var(--ink-panel);
    border-top:3px solid var(--outline); padding:14px 20px calc(14px + env(safe-area-inset-bottom));
  }
  .footer-inner{ max-width:480px; margin:0 auto; display:flex; gap:10px; }
  .btn-primary{
    flex:1; font-family:'Silkscreen',monospace; font-weight:700; font-size:14.5px; padding:14px;
    background:var(--path-idle); border:3px solid var(--outline); color:var(--paper-dim); cursor:not-allowed;
  }
  .btn-primary.ready{ background:var(--gold); color:var(--ink); cursor:pointer; box-shadow:4px 4px 0 var(--outline); }
  .btn-primary.ready:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--outline); }
  .btn-primary.done{ background:var(--success); color:var(--ink); }
  .btn-primary.retry{ background:var(--danger); color:var(--paper); cursor:pointer; box-shadow:4px 4px 0 var(--outline); }
  .btn-primary.retry:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--outline); }

  .xp-toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-20px);
    z-index:20; background:var(--gold); border:3px solid var(--outline); box-shadow:4px 4px 0 var(--outline);
    padding:10px 18px; font-family:'Press Start 2P',monospace; font-size:12px; color:var(--ink);
    opacity:0; transition:opacity .25s ease, transform .25s ease;
  }
  .xp-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      MAPA
    </div>
  </div>

  <div class="eyebrow">MODUŁ 0 · ĆWICZENIE PRAKTYCZNE</div>
  <h1>Ułóż przepływ</h1>
  <div class="instruction">
    Dotknij kroków poniżej w takiej kolejności, w jakiej faktycznie dzieją się, gdy otwierasz ekran pogody w swojej aplikacji.
  </div>

  <section>
    <div class="section-label">TWOJA KOLEJNOŚĆ</div>
    <div class="order-slots" id="orderSlots">
      <div class="slot" data-index="0"><span class="slot-num">1</span><span class="slot-placeholder">dotknij krok poniżej</span></div>
      <div class="slot" data-index="1"><span class="slot-num">2</span><span class="slot-placeholder">—</span></div>
      <div class="slot" data-index="2"><span class="slot-num">3</span><span class="slot-placeholder">—</span></div>
      <div class="slot" data-index="3"><span class="slot-num">4</span><span class="slot-placeholder">—</span></div>
    </div>
    <div class="result-msg" id="resultMsg"></div>
  </section>

  <section>
    <div class="section-label">KROKI (W LOSOWEJ KOLEJNOŚCI)</div>
    <div class="pool" id="pool"></div>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn-reset" id="resetBtn">↻ Zacznij od nowa</button>
    </div>
  </section>
</div>

<div class="xp-toast" id="xpToast">+20 XP</div>

<div class="footer">
  <div class="footer-inner">
    <button class="btn-primary" id="checkBtn" disabled>Sprawdź kolejność</button>
  </div>
</div>

<script>
const STEPS = [
  { id:'a', text:'Otwierasz ekran pogody w aplikacji', correctIndex:0 },
  { id:'b', text:'Aplikacja wysyła request do API pogodowego', correctIndex:1 },
  { id:'c', text:'Serwer odsyła dane w formacie JSON', correctIndex:2 },
  { id:'d', text:'Aplikacja pokazuje temperaturę na ekranie', correctIndex:3 },
];

let order = []; // array of step ids in the order user placed them
let checked = false;
let wrongAttempts = 0;

const HINT = 'Podpowiedź: co musi się wydarzyć, zanim jakiekolwiek dane trafią na ekran — i co musi się wydarzyć zanim serwer w ogóle będzie miał co odesłać?';

function shuffledSteps(){
  const arr = [...STEPS];
  for(let i=arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function renderPool(){
  const pool = document.getElementById('pool');
  pool.innerHTML = '';
  shuffledSteps().forEach(step => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = step.text;
    chip.dataset.id = step.id;
    if(order.includes(step.id)) chip.classList.add('used');
    chip.addEventListener('click', () => placeStep(step.id));
    pool.appendChild(chip);
  });
}

function renderSlots(){
  document.querySelectorAll('.slot').forEach((slot, i) => {
    const stepId = order[i];
    slot.classList.remove('checked-ok','checked-bad');
    if(stepId){
      const step = STEPS.find(s => s.id === stepId);
      slot.classList.add('filled');
      slot.innerHTML = `<span class="slot-num">${i+1}</span><span class="slot-text">${step.text}</span>`;
    } else {
      slot.classList.remove('filled');
      slot.innerHTML = `<span class="slot-num">${i+1}</span><span class="slot-placeholder">${i===0 ? 'dotknij krok poniżej' : '—'}</span>`;
    }
  });

  const checkBtn = document.getElementById('checkBtn');
  if(order.length === STEPS.length && !checked){
    checkBtn.disabled = false;
    checkBtn.classList.add('ready');
    checkBtn.textContent = 'Sprawdź kolejność';
  }
}

function placeStep(id){
  if(checked || order.includes(id) || order.length >= STEPS.length) return;
  order.push(id);
  renderPool();
  renderSlots();
}

document.querySelectorAll('.slot').forEach(slot => {
  slot.addEventListener('click', () => {
    if(checked) return;
    const i = parseInt(slot.dataset.index);
    if(order[i]){
      order.splice(i,1);
      renderPool();
      renderSlots();
    }
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  order = [];
  checked = false;
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('checkBtn').classList.remove('ready','done');
  document.getElementById('checkBtn').textContent = 'Sprawdź kolejność';
  renderPool();
  renderSlots();
});

document.getElementById('checkBtn').addEventListener('click', function(){
  if(this.classList.contains('retry')){
    checked = false;
    order = [];
    this.classList.remove('retry');
    this.disabled = true;
    this.textContent = 'Sprawdź kolejność';
    document.getElementById('resultMsg').classList.remove('show');
    document.getElementById('resultMsg').innerHTML = '';
    renderPool();
    renderSlots();
    return;
  }

  if(!this.classList.contains('ready')) return;

  let allCorrect = true;
  document.querySelectorAll('.slot').forEach((slot, i) => {
    const step = STEPS.find(s => s.id === order[i]);
    const ok = step.correctIndex === i;
    slot.classList.add(ok ? 'checked-ok' : 'checked-bad');
    if(!ok) allCorrect = false;
  });

  checked = true;
  this.classList.remove('ready');

  if(allCorrect){
    this.textContent = 'Zaliczone';
    this.disabled = true;
    this.classList.add('done');
    const toast = document.getElementById('xpToast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  } else {
    wrongAttempts++;
    this.textContent = 'Spróbuj jeszcze raz';
    this.classList.add('retry');

    const msg = document.getElementById('resultMsg');
    let html = 'Niestety, ta kolejność nie jest poprawna.';
    if(wrongAttempts >= 2){
      html += `<div class="hint">${HINT}</div>`;
    }
    msg.innerHTML = html;
    msg.classList.add('show');
  }
});

renderPool();
renderSlots();
</script>
</body>
</html>
