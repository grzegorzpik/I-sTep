<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I-sTep — Mapa</title>
<link rel="icon" href="favicon-32.png">

<link rel="manifest" href="manifest.json">

</head>
<body>

<svg class="terrain" viewBox="0 0 400 900" preserveAspectRatio="xMidYMin slice">
  <rect width="400" height="900" fill="#1B1622"/>
  <polygon points="-20,260 60,190 140,240 220,170 320,230 420,180 420,900 -20,900" fill="#241D2C"/>
  <polygon points="-20,340 90,290 200,330 300,280 420,320 420,900 -20,900" fill="#2B2233"/>
  <polygon points="-20,600 100,560 220,600 340,555 420,590 420,900 -20,900" fill="#211A29"/>
</svg>

<div class="app" id="app">
  <div class="topbar">
    <div class="logo">
      <svg class="logo-chevron" viewBox="0 0 8 12" shape-rendering="crispEdges">
        <rect x="0" y="0" width="2" height="2" fill="var(--brand-mint)"/>
        <rect x="2" y="2" width="2" height="2" fill="var(--brand-mint)"/>
        <rect x="4" y="4" width="2" height="2" fill="var(--brand-mint)"/>
        <rect x="2" y="6" width="2" height="2" fill="var(--brand-mint)"/>
        <rect x="0" y="8" width="2" height="2" fill="var(--brand-mint)"/>
      </svg>
      <span class="logo-text"><span class="wm-purple">I</span><span class="wm-cream">-s</span><span class="wm-purple">T</span><span class="wm-cream">ep</span></span>
    </div>
    <a class="streak" href="profil.html#xp-section">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-1.2-.5-2-1-3 2 1 3 3 3 5a5 5 0 01-10 0c0-5 4-6 5-11z" fill="currentColor"/></svg>
      <span id="xpValue">0</span> XP
    </a>
  </div>

  <div class="greeting" id="greeting"></div>

  <div class="dev-row">
    <button class="dev-reset" id="devReset" type="button">reset apki: postęp + kompan (test)</button>
  </div>

  <div id="modulesRoot"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="lesson-modal" id="lessonModal">
  <div class="lesson-modal-inner">
    <span class="eyebrow" id="modalEyebrow"></span>
    <h2 id="modalTitle"></h2>
    <div class="modal-sub" id="modalSub"></div>
    <div class="modal-actions">
      <button class="btn-primary ready" id="modalStart">Rozpocznij</button>
      <button class="modal-cancel" id="modalCancel">Anuluj</button>
    </div>
  </div>
</div>

<div class="navbar">
  <div class="navbar-inner">
    <a class="navitem active" href="mapa.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      MAPA
    </a>
    <a class="navitem" href="dziennik.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>
      DZIENNIK
    </a>
    <a class="navitem" href="profil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      PROFIL
    </a>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/content.js"></script>

<script src="js/mapa.js"></script>

</html>
