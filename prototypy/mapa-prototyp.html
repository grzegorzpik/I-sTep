<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Szlak — Moduł 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1622;
    --ink-panel:#241D2C;
    --paper:#F3E9D6;
    --paper-dim:#9C90A6;
    --outline:#0C0910;
    --module-accent:#6FA860;
    --module-accent-dark:#3F6E3B;
    --gold:#E3A83F;
    --gold-dark:#9C6C1F;
    --path-idle:#3A3145;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    image-rendering:pixelated;
  }

  .terrain{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }

  .app{ position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:100px;}

  /* top bar */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 20px 10px;
  }
  .logo{
    font-family:'Silkscreen',monospace; font-weight:700; font-size:16px;
    letter-spacing:.04em; color:var(--paper);
    display:flex; align-items:center; gap:8px;
  }
  .logo::before{
    content:''; width:12px; height:12px;
    background:var(--module-accent);
    border:2px solid var(--outline);
  }
  .streak{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14px;
    color:var(--ink);
    background:var(--gold);
    border:2px solid var(--outline);
    padding:5px 10px;
    box-shadow:3px 3px 0 var(--outline);
  }
  .streak svg{width:13px;height:13px;}

  /* module banner */
  .banner{
    margin:18px 20px 8px;
    padding:18px 20px;
    background:var(--ink-panel);
    border:3px solid var(--outline);
    box-shadow:5px 5px 0 var(--outline);
    position:relative;
  }
  .banner .eyebrow{
    font-family:'Press Start 2P',monospace; font-size:9px; letter-spacing:.02em;
    color:var(--module-accent);
    display:block; margin-bottom:10px; line-height:1.6;
  }
  .banner h1{
    font-family:'Silkscreen',monospace; font-size:20px; font-weight:700;
    color:var(--paper);
  }
  .banner .sub{
    margin-top:8px; font-size:12.5px; color:var(--paper-dim);
    font-family:'JetBrains Mono',monospace;
  }

  /* path */
  .path-wrap{ position:relative; padding:44px 0 20px; }
  svg.trail{ position:absolute; top:0; left:0; z-index:0; overflow:visible; }

  .nodes{ position:relative; z-index:1; display:flex; flex-direction:column; gap:0; }

  .node-row{ display:flex; align-items:center; min-height:118px; position:relative; }
  .node-row.left{ justify-content:flex-start; padding-left:16%; }
  .node-row.right{ justify-content:flex-end; padding-right:16%; }
  .node-row.center{ justify-content:center; }

  .node{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .node:active{ transform:translate(2px,2px); }

  .core{
    width:58px; height:58px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P',monospace; font-size:14px;
    position:relative;
    border:3px solid var(--outline);
    clip-path:polygon(20% 0%,80% 0%,100% 20%,100% 80%,80% 100%,20% 100%,0% 80%,0% 20%);
  }

  .node.done .core{
    background:var(--module-accent);
    box-shadow:4px 4px 0 var(--outline);
    color:var(--ink);
  }
  .node.current .core{
    background:var(--paper);
    box-shadow:4px 4px 0 var(--outline);
    color:var(--ink);
    animation:bob 1.6s steps(4) infinite;
  }
  .node.locked .core{
    background:var(--ink-panel);
    border-color:var(--path-idle);
    color:var(--paper-dim);
    box-shadow:4px 4px 0 #00000040;
  }

  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }

  .label{
    position:absolute; top:70px; left:50%; transform:translateX(-50%);
    width:118px; text-align:center;
    font-size:11px; color:var(--paper-dim); line-height:1.35;
    font-family:'Inter',sans-serif; font-weight:500;
  }
  .node.current .label{ color:var(--paper); font-weight:700; }

  /* beacon = bootcamp node */
  .beacon .core{
    width:84px; height:84px;
    background:var(--gold);
    border-color:var(--outline);
    box-shadow:5px 5px 0 var(--outline);
    clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
  }
  .beacon .core::after{ content:'◆'; font-size:20px; color:var(--gold-dark); }

  /* trail — zigzag pixel line, drawn dynamically */
  .trail path.remaining{
    fill:none; stroke:var(--path-idle); stroke-width:4;
    stroke-dasharray:2 10; stroke-linecap:square; stroke-linejoin:miter;
  }
  .trail path.walked{
    fill:none; stroke:var(--module-accent); stroke-width:4;
    stroke-dasharray:8 6; stroke-linecap:square; stroke-linejoin:miter;
  }

  /* bottom nav */
  .navbar{
    position:fixed; bottom:0; left:0; right:0; z-index:5;
    background:var(--ink-panel);
    border-top:3px solid var(--outline);
    display:flex; justify-content:center;
    padding:10px 0 max(10px, env(safe-area-inset-bottom));
  }
  .navbar-inner{ display:flex; gap:52px; max-width:480px; width:100%; justify-content:center; }
  .navitem{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--paper-dim); font-size:9.5px; font-family:'Press Start 2P',monospace;
    letter-spacing:.01em;
  }
  .navitem.active{ color:var(--module-accent); }
  .navitem svg{ width:20px; height:20px; }

  /* mascot */
  .mascot{
    position:absolute;
    width:76px; height:76px;
    z-index:2;
    animation:mascotBob 2.2s steps(4) infinite;
    filter:drop-shadow(3px 3px 0 var(--outline));
  }
  @keyframes mascotBob{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-5px) rotate(-2deg); }
  }
  .mascot .eyes{ transform-box:fill-box; transform-origin:50% 50%; animation:blink 4.2s infinite; }
  @keyframes blink{ 0%,90%,100%{ transform:scaleY(1); } 94%{ transform:scaleY(0.15); } }
</style>
</head>
<body>

<svg class="terrain" viewBox="0 0 400 900" preserveAspectRatio="xMidYMin slice">
  <rect width="400" height="900" fill="#1B1622"/>
  <polygon points="-20,260 60,190 140,240 220,170 320,230 420,180 420,900 -20,900" fill="#241D2C"/>
  <polygon points="-20,340 90,290 200,330 300,280 420,320 420,900 -20,900" fill="#2B2233"/>
  <polygon points="-20,600 100,560 220,600 340,555 420,590 420,900 -20,900" fill="#211A29"/>
</svg>

<div class="app">
  <div class="topbar">
    <div class="logo">SZLAK</div>
    <div class="streak">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-1.2-.5-2-1-3 2 1 3 3 3 5a5 5 0 01-10 0c0-5 4-6 5-11z" fill="currentColor"/></svg>
      12
    </div>
  </div>

  <div class="banner">
    <span class="eyebrow">MODUŁ 0 · INTERNET</span>
    <h1>Klient i serwer</h1>
    <div class="sub">3 / 5 pojęć ukończone</div>
  </div>

  <div class="path-wrap" id="pathWrap">
    <svg class="trail" id="trailSvg"></svg>

    <div class="nodes" id="nodes">
      <div class="node-row center">
        <div class="node done" data-point>
          <div class="core">1</div>
          <div class="label">Co to klient?</div>
        </div>
      </div>
      <div class="node-row left">
        <div class="node done" data-point>
          <div class="core">2</div>
          <div class="label">Request &amp; response</div>
        </div>
      </div>
      <div class="node-row right">
        <div class="node current" data-point>
          <div class="core">3</div>
          <div class="label">Czym jest API</div>
        </div>

        <svg class="mascot" viewBox="0 0 16 16" style="left:12%; top:6px; --bot-body:#6FA860;" shape-rendering="crispEdges">
          <rect x="7" y="0" width="2" height="1.1" fill="var(--bot-body)"/>
          <circle cx="8" cy="0.5" r="0.85" fill="#E3A83F"/>
          <rect x="3.2" y="1.6" width="9.6" height="6.8" fill="#F3E9D6" stroke="#0C0910" stroke-width="0.5"/>
          <rect x="4.4" y="3.2" width="7.2" height="3.6" fill="#1B1622"/>
          <g class="eyes">
            <path d="M5.6,5.0 L6.2,4.4 L6.8,5.0" stroke="#6FA860" stroke-width="0.6" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
            <path d="M9.0,5.0 L9.6,4.4 L10.2,5.0" stroke="#6FA860" stroke-width="0.6" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
          </g>
          <rect x="3" y="8.6" width="10" height="5.4" fill="var(--bot-body)" stroke="#0C0910" stroke-width="0.5"/>
          <rect x="5.5" y="10.2" width="5" height="2.6" fill="#1B1622"/>
          <rect x="6.1" y="10.7" width="3.8" height="0.5" fill="#E3A83F"/>
          <rect x="6.1" y="11.5" width="2.4" height="0.5" fill="#E3A83F"/>
          <rect x="3.4" y="9" width="0.8" height="0.8" fill="#0C0910" opacity=".5"/>
          <rect x="11.8" y="9" width="0.8" height="0.8" fill="#0C0910" opacity=".5"/>
          <rect x="0.6" y="9.4" width="2.2" height="2.2" fill="#F3E9D6" stroke="#0C0910" stroke-width="0.4"/>
          <rect x="13.2" y="9.4" width="2.2" height="2.2" fill="#F3E9D6" stroke="#0C0910" stroke-width="0.4"/>
          <rect x="4" y="14" width="2.8" height="2" fill="#0C0910"/>
          <rect x="9.2" y="14" width="2.8" height="2" fill="#0C0910"/>
        </svg>
      </div>
      <div class="node-row left">
        <div class="node locked" data-point>
          <div class="core">4</div>
          <div class="label">JSON</div>
        </div>
      </div>
      <div class="node-row right">
        <div class="node locked" data-point>
          <div class="core">5</div>
          <div class="label">Endpoint</div>
        </div>
      </div>
      <div class="node-row center" style="min-height:150px;">
        <div class="node beacon locked" data-point>
          <div class="core"></div>
          <div class="label">Bootcamp:<br>integracja API</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="navbar">
  <div class="navbar-inner">
    <div class="navitem active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      MAPA
    </div>
    <div class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>
      DZIENNIK
    </div>
    <div class="navitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      PROFIL
    </div>
  </div>
</div>

<script>
function drawTrail(){
  const wrap = document.getElementById('pathWrap');
  const svg = document.getElementById('trailSvg');
  const points = Array.from(document.querySelectorAll('[data-point] .core'));
  if(!points.length) return;

  const wrapRect = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrapRect.width);
  svg.setAttribute('height', wrapRect.height);
  svg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);

  const coords = points.map(el => {
    const r = el.getBoundingClientRect();
    return {
      x: r.left + r.width/2 - wrapRect.left,
      y: r.top + r.height/2 - wrapRect.top
    };
  });

  // straight zigzag polyline through every point — uniform, no curve distortion at the ends
  function buildPath(pts){
    if(pts.length < 2) return '';
    return 'M ' + pts.map(p => `${p.x} ${p.y}`).join(' L ');
  }

  let walkedEndIndex = 0;
  document.querySelectorAll('[data-point]').forEach((node, i) => {
    if(node.classList.contains('done') || node.classList.contains('current')) walkedEndIndex = i;
  });

  const walkedPts = coords.slice(0, walkedEndIndex+1);
  const remainingPts = coords.slice(walkedEndIndex);

  svg.innerHTML = `
    <path class="remaining" d="${buildPath(remainingPts)}"></path>
    <path class="walked" d="${buildPath(walkedPts)}"></path>
  `;
}

window.addEventListener('load', drawTrail);
window.addEventListener('resize', () => requestAnimationFrame(drawTrail));
</script>
</body>
</html>
