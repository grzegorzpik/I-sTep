<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I-sTep — Dziennik</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/dziennik.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">I-sTep</div>
  </div>

  <h1 class="title">Dziennik</h1>
  <div class="title-sub">Twój log podróży przez świat IT</div>

  <div class="tabs">
    <div class="tab active" data-tab="wpisy">WPISY</div>
    <div class="tab" data-tab="dyplomy">DYPLOMY</div>
  </div>

  <!-- WPISY -->
  <div class="panel active" id="wpisy">
    <div id="pendingBanner"></div>
    <div id="entriesList"></div>

    <div class="empty-state" id="emptyState">
      <div class="empty-frame">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h7a2 2 0 012 2v12a2 2 0 00-2-1H4V5z"/><path d="M20 5h-7a2 2 0 00-2 2v12a2 2 0 012-1h7V5z"/></svg>
      </div>
      <div class="empty-title">Tu pojawią się Twoje wpisy</div>
      <div class="empty-text">
        Po każdej retrospekcji zobaczysz tu, czego się nauczyłeś, co pozostało niejasne i jak wykorzystałeś to w swojej aplikacji.
      </div>
    </div>
  </div>

  <!-- DYPLOMY -->
  <div class="panel" id="dyplomy">
    <div class="grid" id="badgeGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-accent"></div>
    <div class="modal-close" id="modalClose">✕</div>
    <div class="modal-eyebrow" id="modalEyebrow"></div>
    <div class="modal-title" id="modalTitle"></div>

    <div class="modal-section">
      <div class="modal-section-label">Poznane pojęcia</div>
      <div class="concept-tags" id="modalTags"></div>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">Co zbudowano</div>
      <p id="modalDesc"></p>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">Wniosek z dziennika</div>
      <p id="modalNote"></p>
    </div>

    <span class="modal-stamp" id="modalStamp">W TRAKCIE</span>
  </div>
</div>

<div class="navbar">
  <div class="navbar-inner">
    <a class="navitem" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      MAPA
    </a>
    <a class="navitem active" href="dziennik.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/></svg>
      DZIENNIK
    </a>
    <a class="navitem" href="profil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      PROFIL
    </a>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/content.js"></script>
<script src="js/dziennik.js"></script>
</body>
</html>
