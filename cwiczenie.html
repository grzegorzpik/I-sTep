<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I-sTep — Ćwiczenie praktyczne</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/cwiczenie.css">
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <a class="back" href="mapa.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      MAPA
    </a>
  </div>

  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="exerciseTitle"></h1>
  <div class="instruction" id="instruction"></div>

  <section>
    <div class="section-label">TWOJA KOLEJNOŚĆ</div>
    <div class="order-slots" id="orderSlots"></div>
    <div class="result-msg" id="resultMsg"></div>
  </section>

  <section>
    <div class="section-label">KROKI (W LOSOWEJ KOLEJNOŚCI)</div>
    <div class="pool" id="pool"></div>
    <div class="btn-row" style="margin-top:12px;">
      <button class="btn-reset" id="resetBtn">↻ Zacznij od nowa</button>
    </div>
  </section>
</div>

<div class="xp-toast" id="xpToast">+20 XP</div>

<div class="footer">
  <div class="footer-inner">
    <button class="btn-primary" id="checkBtn" disabled>Sprawdź kolejność</button>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/content.js"></script>
<script src="js/cwiczenie.js"></script>
</body>
</html>
