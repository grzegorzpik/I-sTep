<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I-sTep</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/start.css">
</head>
<body>

<div class="stage" id="stage">
  <div class="wordmark-row">
    <svg class="chevron" id="chevron" viewBox="0 0 8 12" shape-rendering="crispEdges">
      <rect x="0" y="0" width="2" height="2" fill="var(--brand-mint)"/>
      <rect x="2" y="2" width="2" height="2" fill="var(--brand-mint)"/>
      <rect x="4" y="4" width="2" height="2" fill="var(--brand-mint)" id="chevronTip"/>
      <rect x="2" y="6" width="2" height="2" fill="var(--brand-mint)"/>
      <rect x="0" y="8" width="2" height="2" fill="var(--brand-mint)"/>
    </svg>
    <div class="wordmark text-part" id="wordmarkText">
      <span class="wm-purple">I</span><span class="wm-cream">-s</span><span class="wm-purple">T</span><span class="wm-cream">ep</span>
    </div>
  </div>

  <svg class="flag-group" id="flagGroup" viewBox="0 0 8 14" width="16" height="28" shape-rendering="crispEdges">
    <rect class="pole" id="pole" x="3.2" y="3" width="1.4" height="11" fill="var(--paper)"/>
    <rect class="flag" id="flag" x="4.6" y="3" width="3.2" height="2.4" fill="var(--brand-purple)"/>
  </svg>

  <svg class="companion" id="companion" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="3.2" y="1.6" width="9.6" height="6.8" fill="var(--paper)" stroke="var(--outline)" stroke-width="0.5"/>
    <rect x="4.4" y="3.2" width="7.2" height="3.6" fill="var(--ink)"/>
    <path d="M5.6,5.0 L6.2,4.4 L6.8,5.0" stroke="var(--bot-body)" stroke-width="0.65" fill="none" stroke-linecap="square"/>
    <path d="M9.0,5.0 L9.6,4.4 L10.2,5.0" stroke="var(--bot-body)" stroke-width="0.65" fill="none" stroke-linecap="square"/>
    <rect x="3" y="8.6" width="10" height="5.4" fill="var(--bot-body)" stroke="var(--outline)" stroke-width="0.5"/>
    <rect class="arm-l" x="0.6" y="9.4" width="2.2" height="2.2" fill="var(--paper)" stroke="var(--outline)" stroke-width="0.4"/>
    <rect class="arm-r" x="13.2" y="9.4" width="2.2" height="2.2" fill="var(--paper)" stroke="var(--outline)" stroke-width="0.4"/>
    <rect x="4" y="14" width="2.8" height="2" fill="var(--outline)"/>
    <rect x="9.2" y="14" width="2.8" height="2" fill="var(--outline)"/>
  </svg>
</div>

<div class="subtitle" id="subtitle">Twój pierwszy krok w świecie IT.</div>

<script src="js/state.js"></script>
<script src="js/start.js"></script>
</body>
</html>
